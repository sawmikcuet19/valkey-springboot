spring:
  application:
    name: valkey-springboot

  # PostgreSQL Configuration
  datasource:
    url: jdbc:postgresql://localhost:5432/valkey_db
    username: postgres
    password: password
    driver-class-name: org.postgresql.Driver

  # Hibernate / JPA - auto-generates schema from entities
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # Valkey Configuration
  data:
    valkey:
      host: localhost
      port: 6379
      timeout: 5000ms

  # Cache configuration - use Valkey as cache provider
  cache:
    type: redis
    redis:
      time-to-live: 600000
      cache-null-values: false

server:
  port: 8080
